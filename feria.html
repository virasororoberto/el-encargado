  let CAMP_FILTRO={max:null,min:null,oferta:false};
  function _campItems(){
    if(!DATA||!DATA.campania) return [];
    const map={}; (DATA.campProds||[]).forEach(cp=>{ map[String(cp.producto_id)]=cp; });
    return (DATA.productos||[]).filter(p=>map[String(p.id)]).map(p=>{ const cp=map[String(p.id)]; const pe=Number(cp.precio_especial)||0; return Object.assign({},p,{precio_camp:pe>0?pe:p.precio,es_oferta:!!cp.es_oferta,precio_lista:p.precio}); });
  }
  function abrirCampania(){ CAMP_FILTRO={max:null,min:null,oferta:false}; pintarCampania(); const v=$('campview'); if(v){ v.classList.add('on'); document.body.style.overflow='hidden'; } }
  function cerrarCampania(){ const v=$('campview'); if(v){ v.classList.remove('on'); document.body.style.overflow=''; } }
  function campFiltrar(tipo,min,max,btn){
    if(tipo==='todos'){ CAMP_FILTRO={max:null,min:null,oferta:false}; }
    else if(tipo==='oferta'){ CAMP_FILTRO={max:null,min:null,oferta:true}; }
    else if(tipo==='precio'){ CAMP_FILTRO={min:min,max:max,oferta:false}; }
    document.querySelectorAll('.cv-filtros button').forEach(b=>b.classList.remove('on'));
    if(btn)btn.classList.add('on');
    _campGrid();
  }
  function pintarCampania(){
    const camp=DATA.campania; if(!camp) return;
    const v=$('campview'); if(!v) return;
    const rangos=String(camp.rangos_precio||'20000,40000,60000').split(',').map(x=>Number(x.trim())||0).filter(Boolean);
    let chips='<button class="on" onclick="campFiltrar(\'todos\',null,null,this)">Todos</button>';
    chips+='<button onclick="campFiltrar(\'oferta\',null,null,this)">🏷️ Ofertas</button>';
    let prev=0;
    rangos.forEach(r=>{ chips+='<button onclick="campFiltrar(\'precio\','+prev+','+r+',this)">Hasta '+money(r)+'</button>'; prev=r; });
    if(prev)chips+='<button onclick="campFiltrar(\'precio\','+prev+',null,this)">Más de '+money(prev)+'</button>';
    v.innerHTML='<div class="cv-head" style="--cc:'+esc(camp.color||'#e11d48')+'"><button class="cv-x" onclick="cerrarCampania()">✕</button><div class="cv-t">❤️ '+esc(camp.titulo_publico||'Campaña')+'</div></div>'+
      '<div class="cv-filtros" style="--cc:'+esc(camp.color||'#e11d48')+'">'+chips+'</div>'+
      '<div class="cv-grid" id="cvgrid"></div>';
    _campGrid();
  }
  function _campGrid(){
    const camp=DATA.campania; const g=$('cvgrid'); if(!g) return;
    let items=_campItems();
    if(CAMP_FILTRO.oferta) items=items.filter(p=>p.es_oferta);
    if(CAMP_FILTRO.max!=null) items=items.filter(p=>p.precio_camp<=CAMP_FILTRO.max && (CAMP_FILTRO.min?p.precio_camp>CAMP_FILTRO.min:true));
    else if(CAMP_FILTRO.min!=null) items=items.filter(p=>p.precio_camp>CAMP_FILTRO.min);
    if(!items.length){ g.innerHTML='<div style="grid-column:1/-1;text-align:center;color:#888;padding:30px">No hay productos en este filtro.</div>'; return; }
    g.innerHTML=items.map(p=>{
      const msg='Hola, vi *'+p.titulo+'* en el Especial '+(camp.titulo_publico||'')+' de Feria del Litoral y quería consultar disponibilidad.';
      let n=String(p.whatsapp||'').replace(/[^0-9]/g,''); if(n&&n.length<=11)n='549'+n.replace(/^0/,'');
      const wa=n?('https://wa.me/'+n+'?text='+encodeURIComponent(msg)):('/l/'+p.local+'/'+p.id);
      const ofer=(p.precio_camp<p.precio_lista&&p.precio_lista>0);
      return '<div class="cv-card">'+
        '<div class="cv-ph" style="background-image:url(\''+esc(p.foto_url)+'\')"></div>'+
        '<div class="cv-body">'+
          (p.es_oferta?'<span class="cv-oferta" style="background:'+esc(camp.color||'#e11d48')+'">OFERTA</span><br>':'')+
          '<div class="cv-nom">'+esc(p.titulo)+'</div>'+
          '<div class="cv-loc">📍 '+esc(p.tienda_nombre)+'</div>'+
          '<div class="cv-pre">'+money(p.precio_camp)+(ofer?'<span class="cv-ant">'+money(p.precio_lista)+'</span>':'')+'</div>'+
        '</div>'+
        '<a class="cv-wa" href="'+wa+'" target="_blank">💬 Consultar</a>'+
      '</div>';
    }).join('');
  }


  function _ytId(u){ const m=String(u||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([\w-]{11})/); return m?m[1]:''; }
  function mostrarPopupBienvenida(){
    const c=DATA&&DATA.campania; if(!c||!c.popup_activo) return;
    try{ if(sessionStorage.getItem('wpop_'+c.id)) return; }catch(e){}
    const box=$('wpop'); if(!box) return;
    let media='';
    if(c.popup_video){ const yt=_ytId(c.popup_video); if(yt){ media='<iframe class="wpop-vid" src="https://www.youtube.com/embed/'+yt+'?rel=0" allow="autoplay;encrypted-media" allowfullscreen></iframe>'; } else { media='<video class="wpop-vid" src="'+esc(c.popup_video)+'" controls playsinline></video>'; } }
    else if(c.popup_imagen){ media='<img class="wpop-img" src="'+esc(c.popup_imagen)+'" alt="">'; }
    box.innerHTML='<div class="wpop-box" style="--ac:'+esc(c.color||'#e11d48')+'"><button class="wpop-x" onclick="cerrarPopup()">✕</button>'+media+
      '<div class="wpop-body">'+
        (c.popup_titulo?'<div class="wpop-tit">'+esc(c.popup_titulo)+'</div>':'')+
        (c.popup_texto?'<div class="wpop-txt">'+esc(c.popup_texto)+'</div>':'')+
        '<button class="wpop-cta" onclick="cerrarPopup();abrirCampania();">'+esc(c.cta_texto||'Ver productos')+' →</button>'+
      '</div></div>';
    box.classList.add('on');
    try{ sessionStorage.setItem('wpop_'+c.id,'1'); }catch(e){}
  }
  function cerrarPopup(){ const b=$('wpop'); if(b)b.classList.remove('on'); }

  function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } }
  function waLink(wa,prod,num,id){ const t='¡Hola! Vi *'+prod+'* en la Feria del Litoral online 👋 ¿Está disponible?'; let n=String(wa||'').replace(/[^0-9]/g,''); if(n&&n.length<=11)n='549'+n.replace(/^0/,''); return n?('https://wa.me/'+n+'?text='+encodeURIComponent(t)):('/l/'+num+'/'+id); }
  const tiendaLink=num=>location.origin+'/l/'+num;
  const prodLink=(num,id)=>location.origin+'/l/'+num+'/'+id;
  function render(){
    if(!DATA||!DATA.ok){ $('app').innerHTML='<div class="empty">La feria no está disponible en este momento.</div>'; return; }
    const cfg=DATA.config||{}, tiendas=DATA.tiendas||[], prods=DATA.productos||[], promos=DATA.promos||[], locales=DATA.locales||[];
    // ===== SISTEMA DE TEMA (todo configurable) =====
    const TEMAS={
      clasico:{ac:'#ff5747',bg:'#f6f6f8',ink:'#0f1115',card:'#fff'},
      oscuro:{ac:'#ff5747',bg:'#0f1115',ink:'#000',card:'#1b1e26'},
      fiesta:{ac:'#ff2d78',bg:'#fff0f6',ink:'#2d0b3a',card:'#fff'},
      verano:{ac:'#00b8d9',bg:'#eefcff',ink:'#003a4d',card:'#fff'},
      elegante:{ac:'#c9a227',bg:'#faf8f3',ink:'#1a1a1a',card:'#fff'},
      navidad:{ac:'#e63946',bg:'#f1faee',ink:'#1d3557',card:'#fff'}
    };
    const baseT=TEMAS[cfg.tema]||TEMAS.clasico;
    const cAc=cfg.color_principal||baseT.ac, cBg=cfg.color_fondo||baseT.bg, cInk=cfg.color_header||baseT.ink, cCard=cfg.color_tarjetas||baseT.card;
    let _sv=':root{--ac:'+cAc+';--bg:'+cBg+';--ink:'+cInk+';--card:'+cCard+';}';
    _sv+='body{background:'+cBg+';color:'+(cfg.tema==='oscuro'?'#e8e8ea':'#14161b')+'}';
    if(cfg.tema==='oscuro'){ _sv+='.p .nm,.shead .t{color:#f0f0f2}.p{border-color:#2a2d36}'; }
    const rad=cfg.radio_bordes!=null&&cfg.radio_bordes!==''?Number(cfg.radio_bordes):null;
    if(rad!=null){ _sv+='.p,.promo,.search,.hslide{border-radius:'+rad+'px}'; }
    if(cfg.fuente==='redonda'){ _sv+="body,.brand .bt,.hslide .nm{font-family:'Nunito',system-ui,sans-serif}"; }
    if(cfg.fuente==='seria'){ _sv+="body{font-family:Georgia,serif}"; }
    document.head.insertAdjacentHTML('beforeend','<style id="temaPortal">'+_sv+'</style>');
    // flags de secciones (mostrar/ocultar)
    const verHero=String(cfg.mostrar_hero)!=='false';
    const verMarq=String(cfg.mostrar_marquesina)!=='false';
    const verTiendas=String(cfg.mostrar_tiendas)!=='false';
    const tituloProd=cfg.titulo_productos||'Todos los productos';
    const tituloTiendas=cfg.titulo_tiendas||'Todas las tiendas';
    const titulo=cfg.titulo||'Feria del Litoral';
    const slogan=(cfg.subtitulo!==undefined&&cfg.subtitulo!=='')?cfg.subtitulo:'Comprá online y recibí en el día 🛵';
    const promoTexto=(cfg.banner_texto||cfg.promo_texto||'').trim();
    const promoOn=(String(cfg.banner_on)!=='false')&&promoTexto;
    const _wP=tiendas.filter(t=>t.portada_url), _nP=tiendas.filter(t=>!t.portada_url); shuffle(_wP); shuffle(_nP); const heroT=_wP.concat(_nP).slice(0,8);
    let html='';
    if(promoOn){ html+=`<div class="promobar"><span>${esc(promoTexto)}</span></div>`; }
    html+=`<div class="top"><div class="wrap brandrow"><div class="brand"><span class="bt">${esc(titulo)}</span>${slogan?`<span class="bs">${esc(slogan)}</span>`:''}</div></div><div class="wrap searchrow"><div class="search">🔎 <input placeholder="Buscá productos, tiendas, marcas..." oninput="buscar(this.value)"></div></div></div>`;
    if(verHero&&heroT.length){
      html+=`<div class="hero"><div class="hcarru" id="hcarru">`+heroT.map(t=>{
        const bgc=t.portada_url?`background-image:url('${esc(t.portada_url)}')`:`background:linear-gradient(135deg,${esc(t.color||'#1b1e26')},#0f1115)`;
        return `<a class="hslide" href="${tiendaLink(t.num)}" style="${bgc}"><div class="ov"></div><div class="in"><div class="lg" style="${t.logo_url?`background-image:url('${esc(t.logo_url)}')`:''}">${t.logo_url?'':'🛍️'}</div><div class="txt"><div class="kick">${esc((t.rubros&&t.rubros[0])||'Tienda de la feria')}</div><div class="nm">${esc(t.nombre)}</div><div class="rb">${t.n} productos · envío en el día 🛵</div></div><span class="cta">Ver tienda →</span></div></a>`;
      }).join('')+`</div><div class="hdots" id="hdots">`+heroT.map((_,k)=>`<i class="${k===0?'on':''}"></i>`).join('')+`</div></div>`;
    }
    const marqItems=tiendas.filter(t=>t.nombre).map(t=>{const ig=(t.instagram||'').replace(/^@/,'').trim();const href=ig?('https://instagram.com/'+ig):tiendaLink(t.num);const et=ig?('@'+ig):esc(t.nombre);return `<a href="${href}"${ig?' target="_blank"':''}><span class="d"></span>${et}</a>`;}).join('');
    if(verMarq&&marqItems){ html+=`<div class="marq"><div class="track">${marqItems}${marqItems}</div></div>`; }
    const _camp=DATA.campania;
    if(_camp){ html+=`<div class="campbanner" onclick="abrirCampania()" style="--cc:${esc(_camp.color||'#e11d48')}"><div class="wrap"><div class="cb-tag">❤️ ESPECIAL ${esc(String(_camp.titulo_publico||'').toUpperCase())}</div><div class="cb-tit">${esc(_camp.titulo_publico||'')}</div><div class="cb-baj">${esc(_camp.bajada||'')}</div><button class="cb-cta">${esc(_camp.cta_texto||'Ver productos')} →</button></div></div>`; }
    html+=`<div class="wrap">`;
    const rubrosSet=[...new Set(prods.flatMap(p=>p.rubros||[]))].sort((a,b)=>a.localeCompare(b));
    const chips=rubrosSet.length?`<div class="rubros" id="rubros"><button class="rchip on" onclick="setRubro('',this)">Todos</button>`+rubrosSet.map(r=>`<button class="rchip" onclick="setRubro('${esc(r).replace(/'/g,'&#39;')}',this)">${esc(r)}</button>`).join('')+`</div>`:'';
    if(verTiendas&&tiendas.length){ html+=`<div class="section" style="padding-top:8px"><div class="shead"><div class="t">🏬 ${esc(tituloTiendas)}</div><div class="c">${tiendas.length} tiendas</div></div><div class="tgrid">`+tiendas.map(t=>tcard(t)).join('')+`</div></div>`; }
    html+=`<div class="section"><div class="shead"><div class="t">🛍️ ${esc(tituloProd)}</div><div class="c">${prods.length} artículos · ${tiendas.length} tiendas</div></div>${chips}<div class="pgrid" id="pgrid"></div></div></div>`;
    if(false){ html+=`<div class="tstrip" id="tiendasFull"><div class="wrap"><div class="section"><div class="shead"><div class="t">🏬 ${esc(tituloTiendas)}</div></div><div class="tgrid">`+tiendas.map(t=>tcard(t)).join('')+`</div></div>
      <div class="lito-sec"><div class="em2">🤖</div><div class="k">Asistente de la feria</div><h3>¿Buscás algo? Preguntale a Lito</h3><p>Lito es la inteligencia artificial de la Feria del Litoral. Escribile como si fuera un WhatsApp y te ayuda a encontrar lo que buscás entre todos los locales.</p><a href="javascript:void(0)" onclick="if(window.voiceflow&&window.voiceflow.chat)window.voiceflow.chat.open()">💬 Consultar con Lito</a></div>
    </div></div>`;
    }
    html+=`<div class="foot"><div class="fb">${esc(titulo)}</div>${esc(cfg.cierre_texto||'Comprá por WhatsApp y recibí en el día 🛵')}</div>`;
    html+=`${''}<a class="lito-fab" href="${esc(LITO_URL)}" target="_blank"><span class="av">🤖</span><span class="lbl">Consultá con Lito</span></a>`;
    $('app').innerHTML=html; pintarGrid(); heroAuto();
  }
  function pcard(p){ const agot=p.stock==='AGOTADO';
    return `<div class="p"><div class="ph" data-bg="${p.foto_url?esc(p.foto_url):''}" onclick="location.href='${prodLink(p.tienda_num,p.id)}'">${p.descuento>0?`<span class="tag">-${p.descuento}%</span>`:(agot?`<span class="tag ag">Agotado</span>`:'')}</div><div class="info"><div class="nm">${esc(p.titulo)}</div><div class="pr">${p.precio>0?`<span class="now">${money(p.precio)}</span>`:''}${p.precio_antes>p.precio?`<span class="old">${money(p.precio_antes)}</span>`:''}</div><div class="st"><span class="dot" style="background:${esc(p.color||'#888')}"></span>${esc(p.tienda_nombre)}</div><a class="buy" href="${waLink(p.whatsapp,p.titulo,p.tienda_num,p.id)}" target="_blank">💬 Comprar</a></div></div>`; }
  function lcard(t){ const img=t.logo_url||t.portada_url; return `<a class="lc" href="${tiendaLink(t.num)}"><div class="lclogo" style="${img?`background-image:url('${esc(img)}')`:`background:linear-gradient(135deg,${esc(t.color||'#1b1e26')},#0f1115)`}">${img?'':'🛍️'}</div><div class="lcnm">${esc(t.nombre)}</div></a>`; }
  function tcard(t){ return `<a class="t" href="${tiendaLink(t.num)}"><div class="cov" style="${t.portada_url?`background-image:url('${esc(t.portada_url)}')`:`background:linear-gradient(135deg,${esc(t.color||'#1b1e26')},#0f1115)`}"><div class="lg" style="${t.logo_url?`background-image:url('${esc(t.logo_url)}')`:''}">${t.logo_url?'':'🛍️'}</div></div><div class="bd"><div class="nm">${esc(t.nombre)}</div><div class="rb2">${esc((t.rubros||[]).join(' · ')||'Tienda de la feria')}</div><div class="np">${t.n} productos · Ver →</div></div></a>`; }
  function visibles(){ const f=FILTRO.toLowerCase().trim(); return (DATA.productos||[]).filter(p=> (!RUBRO_SEL||(p.rubros||[]).indexOf(RUBRO_SEL)>=0) && (!f || (p.titulo||'').toLowerCase().indexOf(f)>=0 || (p.tienda_nombre||'').toLowerCase().indexOf(f)>=0) ); }
  function setRubro(r,el){ RUBRO_SEL=r; document.querySelectorAll('.rchip').forEach(c=>c.classList.remove('on')); if(el)el.classList.add('on'); pintarGrid(); const g=document.getElementById('pgrid'); if(g&&g.scrollIntoView)g.scrollIntoView({behavior:'smooth',block:'start'}); }
  
  function _lazyImgs(){
    try{
      const els=document.querySelectorAll('.ph[data-bg]');
      if(!els.length) return;
      if(!('IntersectionObserver' in window)){ els.forEach(function(e){ const u=e.getAttribute('data-bg'); if(u){ e.style.backgroundImage="url('"+u+"')"; } e.removeAttribute('data-bg'); }); return; }
      const io=new IntersectionObserver(function(entries){
        entries.forEach(function(en){ if(en.isIntersecting){ const e=en.target; const u=e.getAttribute('data-bg'); if(u){ e.style.backgroundImage="url('"+u+"')"; } e.removeAttribute('data-bg'); io.unobserve(e); } });
      },{rootMargin:'300px'});
      els.forEach(function(e){ io.observe(e); });
      // RED DE SEGURIDAD: a los 4s, cargar lo que quede sin cargar
      setTimeout(function(){ document.querySelectorAll('.ph[data-bg]').forEach(function(e){ const u=e.getAttribute('data-bg'); if(u){ e.style.backgroundImage="url('"+u+"')"; } e.removeAttribute('data-bg'); }); },4000);
    }catch(e){ document.querySelectorAll('.ph[data-bg]').forEach(function(x){ const u=x.getAttribute('data-bg'); if(u)x.style.backgroundImage="url('"+u+"')"; x.removeAttribute('data-bg'); }); }
  }

  function pintarGrid(){ const g=$('pgrid'); if(!g)return; const v=visibles(); g.innerHTML=v.length?v.map(pcard).join(''):'<div class="empty">No encontramos productos con esa búsqueda.</div>'; setTimeout(_lazyImgs,30); }
  function buscar(q){ FILTRO=q; pintarGrid(); }
  function heroAuto(){ const t=$('hcarru'),dots=$('hdots'); if(!t)return; if(_hTimer)clearInterval(_hTimer); const n=t.querySelectorAll('.hslide').length; if(n<2)return;
    t.addEventListener('scroll',()=>{ const i=Math.round(t.scrollLeft/t.clientWidth); if(dots)Array.prototype.forEach.call(dots.children,(el,k)=>el.className=k===i?'on':''); },{passive:true});
    _hTimer=setInterval(()=>{ if(!document.body.contains(t)){clearInterval(_hTimer);return;} _hIdx=(_hIdx+1)%n; t.scrollTo({left:_hIdx*t.clientWidth,behavior:'smooth'}); },4500); }
</script>
