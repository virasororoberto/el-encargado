<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feria del Litoral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#0e1013; --ac:#c6f24e; --bd:#e6e7ea; --mut:#7a7d85; --wa:#25d366; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:#f4f5f7;color:#16181d}
  .wrap{max-width:1160px;margin:0 auto;padding:0 16px}
  a{text-decoration:none;color:inherit}
  .top{background:var(--ink);color:#fff;position:sticky;top:0;z-index:20}
  .top .wrap{display:flex;align-items:center;gap:14px;padding:12px 16px}
  .logo{font-family:'Archivo';font-weight:900;font-size:20px;letter-spacing:-.5px}
  .logo .hl{color:var(--ac)}
  .search{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:100px;padding:9px 15px}
  .search input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:14px}
  .search input::placeholder{color:rgba(255,255,255,.5)}
  @media(max-width:640px){ .search{order:3;max-width:none;flex-basis:100%} .top .wrap{flex-wrap:wrap} }
  .flagbar{background:#0a0c0f;overflow:hidden;white-space:nowrap}
  .flagbar .track{display:inline-flex;animation:slideflags 34s linear infinite}
  .flagbar .fl{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;font-size:12.5px;font-weight:700;color:rgba(255,255,255,.85)}
  .flagbar .fl .em{font-size:18px}
  @keyframes slideflags{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .promo{background:linear-gradient(120deg,#0e1013,#16233a 60%,#0e1013);color:#fff}
  .promo .wrap{padding:20px 16px}
  .promo b{font-family:'Archivo';font-weight:900;font-size:clamp(19px,4.5vw,28px);display:block;letter-spacing:-.5px}
  .promo p{color:rgba(255,255,255,.82);font-size:14px;margin-top:6px;max-width:600px}
  .section-h{font-family:'Archivo';font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--mut);margin:22px 0 3px}
  .section-t{font-family:'Archivo';font-weight:900;font-size:22px;color:var(--ink);margin-bottom:12px;letter-spacing:-.5px}
  /* carrusel destacados */
  .carru{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;scrollbar-width:none}
  .carru::-webkit-scrollbar{display:none}
  .cslide{flex:0 0 210px;scroll-snap-align:start;background:#fff;border:1px solid var(--bd);border-radius:16px;overflow:hidden;cursor:pointer}
  .cslide .ph{height:150px;background-position:center;background-size:cover;position:relative}
  .cslide .ph .tag{position:absolute;top:8px;left:8px;background:#e11d48;color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:100px}
  .cslide .bd{padding:10px 12px 12px}
  .cslide .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cslide .pr{font-family:'Archivo';font-weight:900;font-size:16px;margin-top:3px}
  .cslide .st{font-size:11px;color:var(--mut);margin-top:2px}
  /* filtros */
  .rubros{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;margin-top:6px}
  .rubros::-webkit-scrollbar{display:none}
  .rb{flex:0 0 auto;background:#fff;border:1.5px solid var(--bd);border-radius:100px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .rb.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  /* grilla productos */
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin:14px 0 8px}
  .p{background:#fff;border:1px solid var(--bd);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
  .p .ph{height:150px;background-position:center;background-size:cover;background-color:#eef0f3;position:relative;cursor:pointer}
  .p .ph .tag{position:absolute;top:8px;left:8px;background:#e11d48;color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:100px}
  .p .info{padding:10px 11px 12px;display:flex;flex-direction:column;flex:1}
  .p .nm{font-weight:600;font-size:13.5px;line-height:1.25;min-height:34px}
  .p .pr{margin-top:5px;display:flex;align-items:baseline;gap:6px}
  .p .pr .now{font-family:'Archivo';font-weight:900;font-size:17px}
  .p .pr .old{font-size:12px;color:var(--mut);text-decoration:line-through}
  .p .st{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid #f0f1f3;font-size:11.5px;color:var(--mut);font-weight:600}
  .p .st .dot{width:8px;height:8px;border-radius:50%}
  .p .buy{margin-top:9px;background:var(--wa);color:#0a2e17;border:none;border-radius:10px;padding:9px;font-weight:800;font-size:12.5px;cursor:pointer}
  /* tiendas */
  .tstrip{background:#fff;border-top:1px solid var(--bd);margin-top:26px}
  .tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:12px 0 30px}
  .t{border:1px solid var(--bd);border-radius:14px;padding:14px 12px;text-align:center;cursor:pointer}
  .t:hover{box-shadow:0 8px 18px rgba(0,0,0,.07)}
  .t .lg{width:52px;height:52px;border-radius:13px;margin:0 auto 8px;background-position:center;background-size:cover;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff}
  .t .nm{font-family:'Archivo';font-weight:800;font-size:14px}
  .t .rb2{font-size:11px;color:var(--mut);margin-top:2px}
  .t .np{font-size:11px;color:var(--mut);margin-top:6px}
  .footer{background:var(--ink);color:rgba(255,255,255,.7);text-align:center;padding:26px 16px;font-size:13px}
  .loading{text-align:center;padding:60px 20px;color:var(--mut)}
  .empty{text-align:center;padding:50px 20px;color:var(--mut)}
</style>
</head>
<body>
  <div id="app"><div class="loading">Cargando la feria… 🛍️</div></div>

<script>
  const CONFIG={ API:'https://script.google.com/macros/s/AKfycbxc2TXvwKC60sBrIUXEdTMRMlCFC1syCQfyPMXr2esqG9XPvHFLX6UWu-HM17lKrOFM/exec', TOKEN:'feria2024' };
  const $=id=>document.getElementById(id);
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money=n=>'$'+(Number(n)||0).toLocaleString('es-AR');
  const paises=[['🇦🇷','Argentina'],['🇦🇼','Aruba'],['🇧🇴','Bolivia'],['🇧🇷','Brasil'],['🇨🇱','Chile'],['🇨🇴','Colombia'],['🇨🇼','Curazao'],['🇪🇨','Ecuador'],['🇬🇾','Guyana'],['🇵🇦','Panamá'],['🇵🇾','Paraguay'],['🇵🇪','Perú'],['🇸🇷','Surinam'],['🇺🇾','Uruguay'],['🇻🇪','Venezuela']];
  let DATA=null, FILTRO='', _heroTimer=null;

  fetch(CONFIG.API+'?accion=feria_portal&token='+CONFIG.TOKEN).then(r=>r.json()).then(d=>{ DATA=d; if(DATA&&DATA.productos){ shuffle(DATA.productos); } render(); }).catch(e=>{ $('app').innerHTML='<div class="empty">No se pudo cargar la feria. Probá de nuevo.</div>'; });
  function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } }

  function waLink(wa,prod,num,id){
    var t='¡Hola! Vi *'+prod+'* en la Feria del Litoral online 👋 ¿Está disponible?';
    var n=String(wa||'').replace(/[^0-9]/g,''); if(n && n.length<=11) n='549'+n.replace(/^0/,'');
    return n? ('https://wa.me/'+n+'?text='+encodeURIComponent(t)) : ('/l/'+num+'/'+id);
  }
  function tiendaLink(num){ return location.origin+'/l/'+num; }
  function prodLink(num,id){ return location.origin+'/l/'+num+'/'+id; }

  function render(){
    if(!DATA||!DATA.ok){ $('app').innerHTML='<div class="empty">La feria no está disponible en este momento.</div>'; return; }
    const cfg=DATA.config||{}; const tiendas=DATA.tiendas||[]; const prods=DATA.productos||[];
    const dest=prods.filter(p=>p.destacado&&p.foto_url); const carruList=(dest.length?dest:prods.filter(p=>p.foto_url)).slice(0,15);
    let html=`
      <div class="top"><div class="wrap">
        <div class="logo">${esc(cfg.titulo||'Feria del Litoral').toUpperCase()}</div>
        <div class="search">🔎 <input placeholder="Buscá en toda la feria..." oninput="buscar(this.value)"></div>
      </div></div>`;
    if(cfg.mostrar_carrusel_banderas!==false){
      const bar=paises.map(p=>`<span class="fl"><span class="em">${p[0]}</span> ${p[1]}</span>`).join('<span class="fl" style="opacity:.3">•</span>');
      html+=`<div class="flagbar"><div class="track">${bar}<span class="fl" style="opacity:.3">•</span>${bar}</div></div>`;
    }
    if(cfg.banner_on!==false){
      html+=`<div class="promo"><div class="wrap"><b>${esc(cfg.banner_titulo||'')}</b><p>${esc(cfg.banner_texto||'')}</p></div></div>`;
    }
    html+=`<div class="wrap">`;
    if(cfg.carrusel_on!==false && carruList.length){
      html+=`<div class="section-h">Lo más destacado</div><div class="section-t">🔥 Productos que se lucen</div>
        <div class="carru" id="carru">${carruList.map(p=>cslide(p)).join('')}</div>`;
    }
    // rubros
    const rubros=[...new Set(tiendas.flatMap(t=>t.rubros||[]))].slice(0,10);
    html+=`<div class="section-h" style="margin-top:24px">Toda la feria</div><div class="section-t">🛍️ Todos los productos (${prods.length})</div>`;
    html+=`<div class="pgrid" id="pgrid"></div>`;
    html+=`</div>`;
    // tiendas
    html+=`<div class="tstrip"><div class="wrap"><div class="section-h" style="margin-top:22px">Conocé los locales</div><div class="section-t">🏬 Todas las tiendas (${tiendas.length})</div>
      <div class="tgrid">${tiendas.map(t=>tcard(t)).join('')}</div></div></div>`;
    html+=`<div class="footer">${esc(cfg.cierre_texto||'')}</div>`;
    $('app').innerHTML=html;
    pintarGrid();
    heroAuto(cfg.carrusel_seg);
  }
  function cslide(p){
    return `<a class="cslide" href="${prodLink(p.tienda_num,p.id)}">
      <div class="ph" style="background-image:url('${esc(p.foto_url)}')">${p.descuento>0?`<span class="tag">-${p.descuento}%</span>`:''}</div>
      <div class="bd"><div class="nm">${esc(p.titulo)}</div><div class="pr">${p.precio>0?money(p.precio):''}</div><div class="st">${esc(p.tienda_nombre)}</div></div>
    </a>`;
  }
  function pcard(p){
    const agot=p.stock==='AGOTADO';
    return `<div class="p">
      <div class="ph" style="background-image:url('${esc(p.foto_url)}')" onclick="location.href='${prodLink(p.tienda_num,p.id)}'">${p.descuento>0?`<span class="tag">-${p.descuento}%</span>`:(agot?`<span class="tag" style="background:#4b5563">Agotado</span>`:'')}</div>
      <div class="info">
        <div class="nm">${esc(p.titulo)}</div>
        <div class="pr">${p.precio>0?`<span class="now">${money(p.precio)}</span>`:''}${p.precio_antes>p.precio?`<span class="old">${money(p.precio_antes)}</span>`:''}</div>
        <div class="st"><span class="dot" style="background:${esc(p.color||'#888')}"></span>${esc(p.tienda_nombre)}</div>
        <a class="buy" href="${waLink(p.whatsapp,p.titulo,p.tienda_num,p.id)}" target="_blank" style="text-align:center;display:block">💬 Comprar</a>
      </div>
    </div>`;
  }
  function tcard(t){
    return `<a class="t" href="${tiendaLink(t.num)}">
      <div class="lg" style="background:${t.logo_url?`#fff url('${esc(t.logo_url)}')`:esc(t.color||'#0e1013')};background-size:cover;background-position:center">${t.logo_url?'':'🛍️'}</div>
      <div class="nm">${esc(t.nombre)}</div>
      <div class="rb2">${esc((t.rubros||[]).join(' · ')||'Tienda')}</div>
      <div class="np">${t.n} productos · Ver →</div>
    </a>`;
  }
  function visibles(){ const f=FILTRO.toLowerCase().trim(); return (DATA.productos||[]).filter(p=> !f || (p.titulo||'').toLowerCase().indexOf(f)>=0 || (p.tienda_nombre||'').toLowerCase().indexOf(f)>=0 ); }
  function pintarGrid(){ const g=$('pgrid'); if(!g)return; const v=visibles(); g.innerHTML=v.length?v.map(pcard).join(''):'<div class="empty">No encontramos productos con esa búsqueda.</div>'; }
  function buscar(q){ FILTRO=q; pintarGrid(); }
  function heroAuto(seg){ const t=$('carru'); if(!t)return; seg=Number(seg)||0; if(_heroTimer)clearInterval(_heroTimer); if(seg<=0)return;
    _heroTimer=setInterval(()=>{ if(!document.body.contains(t)){clearInterval(_heroTimer);return;} const w=t.querySelector('.cslide'); if(!w)return; let nx=t.scrollLeft+w.offsetWidth+12; if(nx>t.scrollWidth-t.clientWidth-10)nx=0; t.scrollTo({left:nx,behavior:'smooth'}); }, seg*1000); }
</script>
</body>
</html>
