<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1628">
<title>Tienda · Feria del Litoral</title>
<style>
  :root{ --nav:#0a1628; --nav2:#1f3a6b; --do:#e8b64c; --gr:#64748b; --bd:#e2e8f0; --ve:#16a34a; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#f1f5f9;color:#0f172a}
  .wrap{max-width:640px;margin:0 auto;min-height:100vh;background:#f8fafc}
  header{background:linear-gradient(135deg,var(--nav),var(--nav2));color:#fff;padding:22px 18px 20px;position:relative;overflow:hidden}
  header .badge{display:inline-block;background:rgba(232,182,76,.18);color:var(--do);border:1px solid rgba(232,182,76,.5);font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:4px 10px;border-radius:20px}
  header h1{margin:10px 0 2px;font-size:26px;line-height:1.1;font-weight:800}
  header .sub{font-size:13px;color:rgba(255,255,255,.75)}
  .content{padding:14px 12px 40px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .card{background:#fff;border:1px solid var(--bd);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .12s,box-shadow .12s;box-shadow:0 1px 3px rgba(15,23,42,.06)}
  .card:active{transform:scale(.97)}
  .card .ph{width:100%;aspect-ratio:1/1;background:#e9eef5 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#b8c2d0;font-size:36px}
  .card .info{padding:10px 11px 12px}
  .card .t{font-size:14px;font-weight:700;line-height:1.25;color:#0f172a;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
  .card .p{font-size:16px;font-weight:800;color:var(--nav);margin-top:5px}
  .card .talles{font-size:11px;color:var(--gr);margin-top:3px}
  .empty{text-align:center;padding:60px 24px;color:var(--gr)}
  .empty .em{font-size:46px;margin-bottom:12px}
  .empty h2{font-size:18px;color:var(--nav);margin:0 0 6px}
  footer{text-align:center;padding:22px 16px 30px;color:var(--gr);font-size:12px}
  footer b{color:var(--nav)}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(8,15,30,.72);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .ov.on{display:flex}
  .sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;animation:up .22s ease}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .sheet .big{width:100%;aspect-ratio:1/1;background:#e9eef5 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#b8c2d0;font-size:60px}
  .sheet .body{padding:16px 18px 22px}
  .sheet .t{font-size:20px;font-weight:800;line-height:1.2}
  .sheet .p{font-size:24px;font-weight:800;color:var(--nav);margin:8px 0}
  .sheet .lbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gr);font-weight:700;margin-top:12px}
  .sheet .desc{font-size:15px;color:#334155;white-space:pre-wrap;line-height:1.45;margin-top:4px}
  .sheet .talles{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .sheet .talles span{border:1px solid var(--bd);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600;background:#f8fafc}
  .wa{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:20px;background:#25d366;color:#fff;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:800;text-decoration:none;cursor:pointer}
  .wa:active{opacity:.9}
  .close{position:sticky;top:0;display:flex;justify-content:flex-end;padding:8px;background:linear-gradient(#fff,rgba(255,255,255,0))}
  .close button{background:rgba(15,23,42,.06);border:none;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;color:#334155}
  .load{text-align:center;padding:70px 20px;color:var(--gr)}
  .spin{width:34px;height:34px;border:3px solid var(--bd);border-top-color:var(--nav);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 14px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div id="app">
    <div class="load"><div class="spin"></div>Cargando tienda...</div>
  </div>
</div>

<div class="ov" id="ov" onclick="if(event.target===this)cerrar()">
  <div class="sheet" id="sheet"></div>
</div>

<script>
const API='https://script.google.com/macros/s/AKfycbxc2TXvwKC60sBrIUXEdTMRMlCFC1syCQfyPMXr2esqG9XPvHFLX6UWu-HM17lKrOFM/exec';
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(n){n=Number(n)||0;return '$'+Math.round(n).toLocaleString('es-AR');}
function qs(k){return new URLSearchParams(location.search).get(k);}
function waNum(raw){let w=String(raw||'').replace(/[^\d]/g,'');if(!w)return '';if(w.indexOf('54')!==0)w='549'+w;return w;}

let DATA=null;
const LOCAL=qs('local');

async function cargar(){
  if(!LOCAL){ $('app').innerHTML=vacio('🔎','Falta el local','El link no tiene número de local.'); return; }
  try{
    const url=new URL(API); url.searchParams.set('accion','tienda_publica'); url.searchParams.set('local',LOCAL);
    const r=await fetch(url.toString()); const d=await r.json();
    DATA=d;
    if(!d.ok || !d.autorizado){ $('app').innerHTML=vacio('🛍️','Tienda no disponible','Este local todavía no tiene su tienda online activa.'); return; }
    render(d);
  }catch(e){ $('app').innerHTML=vacio('📡','Sin conexión','Probá de nuevo en un momento.'); }
}

function vacio(em,t,s){
  return `<header><span class="badge">Feria del Litoral</span><h1>Tienda online</h1></header>
  <div class="empty"><div class="em">${em}</div><h2>${t}</h2><div>${s}</div></div>`;
}

function render(d){
  const prods=d.productos||[];
  let html=`<header>
    <span class="badge">★ Tienda oficial · Feria del Litoral</span>
    <h1>${esc(d.nombre||('Local '+d.local))}</h1>
    <div class="sub">Mirá los productos y consultá directo por WhatsApp</div>
  </header><div class="content">`;
  if(!prods.length){
    html+=`<div class="empty"><div class="em">📦</div><h2>Todavía no hay productos</h2><div>Este local va a ir cargando su vidriera. Volvé pronto.</div></div>`;
  } else {
    html+=`<div class="grid">`+prods.map((p,i)=>{
      const bg=p.foto_url?`style="background-image:url('${esc(p.foto_url)}')"`:'';
      return `<div class="card" onclick="abrir(${i})">
        <div class="ph" ${bg}>${p.foto_url?'':'🖼️'}</div>
        <div class="info">
          <div class="t">${esc(p.titulo)}</div>
          ${p.precio>0?`<div class="p">${money(p.precio)}</div>`:''}
          ${p.talles?`<div class="talles">Talles: ${esc(p.talles)}</div>`:''}
        </div>
      </div>`;
    }).join('')+`</div>`;
  }
  html+=`</div><footer>Vidriera del local · <b>Feria del Litoral</b><br>Santa Fe</footer>`;
  $('app').innerHTML=html;
}

function abrir(i){
  const p=(DATA.productos||[])[i]; if(!p) return;
  const wa=waNum(DATA.whatsapp);
  const msg=encodeURIComponent(`¡Hola! Vengo de la Feria del Litoral y me interesa: ${p.titulo}`);
  const waBtn = wa
    ? `<a class="wa" href="https://wa.me/${wa}?text=${msg}" target="_blank">💬 Consultar por WhatsApp</a>`
    : `<div style="text-align:center;color:var(--gr);font-size:13px;margin-top:18px">El local todavía no cargó su WhatsApp de contacto.</div>`;
  const bg=p.foto_url?`style="background-image:url('${esc(p.foto_url)}')"`:'';
  $('sheet').innerHTML=`
    <div class="close"><button onclick="cerrar()">✕</button></div>
    <div class="big" ${bg}>${p.foto_url?'':'🖼️'}</div>
    <div class="body">
      <div class="t">${esc(p.titulo)}</div>
      ${p.precio>0?`<div class="p">${money(p.precio)}</div>`:''}
      ${p.talles?`<div class="lbl">Talles disponibles</div><div class="talles">${p.talles.split(/[,\/]/).map(t=>t.trim()).filter(Boolean).map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}
      ${p.descripcion?`<div class="lbl">Descripción</div><div class="desc">${esc(p.descripcion)}</div>`:''}
      ${waBtn}
    </div>`;
  $('ov').classList.add('on'); document.body.style.overflow='hidden';
}
function cerrar(){ $('ov').classList.remove('on'); document.body.style.overflow=''; }

cargar();
</script>
</body>
</html>
