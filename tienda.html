<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Tienda online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ac:#111827; --ac-soft:#1f2937; --ink:#0e1013; --paper:#f6f6f4;
    --gr:#6b7280; --bd:#e7e7ea; --card:#ffffff; --lime:#c6f24e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--paper);color:#17181c;-webkit-font-smoothing:antialiased}
  .app{max-width:1180px;margin:0 auto;min-height:100vh;background:var(--paper);padding-bottom:64px}

  /* ---------- top bar ---------- */
  .topbar{position:sticky;top:0;z-index:45;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--bd)}
  .topbar .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 18px}
  .brand{font-family:'Archivo';font-weight:800;font-size:16px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
  .cartbtn{display:flex;align-items:center;gap:8px;background:var(--ac);color:#fff;border:none;border-radius:100px;padding:9px 15px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:'Inter';transition:transform .12s}
  .cartbtn:active{transform:scale(.96)}
  .cartbtn .n{background:rgba(255,255,255,.22);border-radius:100px;min-width:20px;text-align:center;padding:1px 6px;font-size:12px;font-weight:800}

  /* ---------- masthead (identity + delivery hook, centered) ---------- */
  .masthead{position:relative;overflow:hidden;background:var(--ink);color:#fff;text-align:center}
  .masthead .cover-bg{position:absolute;inset:0;background-position:center;background-size:cover;opacity:.26}
  .masthead .glow{position:absolute;inset:0;background:radial-gradient(75% 130% at 50% -15%, color-mix(in srgb, var(--ac) 60%, transparent) 0%, transparent 62%)}
  .masthead .veil{position:absolute;inset:0;background:linear-gradient(180deg, rgba(14,16,19,.35), rgba(14,16,19,.85))}
  .masthead .in{position:relative;z-index:3;max-width:720px;margin:0 auto;padding:38px 22px 40px}
  .store{font-family:'Archivo';font-weight:900;font-size:clamp(32px,8.5vw,54px);line-height:.98;letter-spacing:-1.2px;text-transform:uppercase}
  .storedesc{font-size:14.5px;color:rgba(255,255,255,.8);margin:12px auto 0;line-height:1.5;max-width:520px;white-space:pre-wrap}
  .rule{width:52px;height:3px;background:var(--lime);border-radius:3px;margin:22px auto 20px}
  .hook{display:flex;align-items:center;justify-content:center;gap:11px;flex-wrap:wrap}
  .hook .moto{font-size:27px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
  .hook .big{font-family:'Bebas Neue';font-weight:400;font-size:clamp(26px,7vw,40px);letter-spacing:1.5px;line-height:1}
  .hook .big .hl{color:var(--lime)}
  .subhook{font-size:13px;color:rgba(255,255,255,.72);margin-top:8px;max-width:520px;margin-left:auto;margin-right:auto;line-height:1.4}
  .live{display:inline-flex;align-items:center;gap:9px;margin-top:16px;background:var(--lime);color:#0f2109;font-weight:800;font-size:13.5px;padding:9px 16px;border-radius:100px;box-shadow:0 8px 22px rgba(198,242,78,.3)}
  .live .dot{width:8px;height:8px;border-radius:50%;background:#0f2109;animation:pulse 1.3s ease-in-out infinite}
  .live.off{background:rgba(255,255,255,.09);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.16)}
  .live.off .dot{background:var(--lime)}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.65)}}
  .sheen{position:absolute;inset:0;z-index:1;background:linear-gradient(115deg,transparent 34%,rgba(198,242,78,.09) 47%,transparent 60%);background-size:280% 100%;animation:sheen 7s linear infinite}
  @keyframes sheen{0%{background-position:220% 0}100%{background-position:-90% 0}}

  /* ---------- trust chips (centered) ---------- */
  .trust{max-width:900px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:16px 16px 2px}
  .chip{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--bd);border-radius:100px;padding:8px 14px;font-size:12.5px;font-weight:600;color:#2b2d33;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .chip b{font-weight:800}
  /* filtros de categorías */
  .filtros{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
  .filtros::-webkit-scrollbar{display:none}
  .fchip{flex:0 0 auto;background:#fff;border:1.5px solid var(--bd);border-radius:100px;padding:8px 15px;font-size:13px;font-weight:600;color:#2b2d33;cursor:pointer;white-space:nowrap;transition:all .12s}
  .fchip.on{background:var(--ac);border-color:var(--ac);color:#fff}
  .fsubs{display:flex;gap:7px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
  .fsubs::-webkit-scrollbar{display:none}
  .fsub{flex:0 0 auto;background:transparent;border:1px solid var(--bd);border-radius:100px;padding:6px 13px;font-size:12.5px;font-weight:600;color:#555;cursor:pointer;white-space:nowrap}
  .fsub.on{background:#111827;border-color:#111827;color:#fff}

  /* delivery band (franja separada, aireada) */
  .delivband{background:var(--ink);color:#fff;text-align:center;border-top:1px solid rgba(255,255,255,.07)}
  .delivband .in{max-width:680px;margin:0 auto;padding:22px 22px 26px}
  /* logo */
  .logo-img{height:56px;width:auto;max-width:180px;object-fit:contain;margin:0 auto 14px;display:block;filter:drop-shadow(0 5px 14px rgba(0,0,0,.45))}
  /* hero slider (destacados grandes que pasan) */
  .hslider{max-width:1040px;margin:16px auto 2px;padding:0 14px}
  .hslider .hlabel{font-family:'Archivo';font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:2.5px;color:#9a9ca3;text-align:center;margin-bottom:10px}
  .hslider .htrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
  .hslider .htrack::-webkit-scrollbar{display:none}
  .hslide{flex:0 0 90%;max-width:90%;scroll-snap-align:center;position:relative;border-radius:20px;overflow:hidden;aspect-ratio:16/10;background:#111 center/cover no-repeat;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.14)}
  .hslide .ov2{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.66),rgba(0,0,0,.05) 62%)}
  .hslide .cap2{position:absolute;left:20px;bottom:18px;right:18px;color:#fff;z-index:2}
  .hslide .cap2 .badge{display:inline-block;background:var(--ac);color:#fff;font-size:11px;font-weight:800;padding:3px 11px;border-radius:100px;margin-bottom:8px}
  .hslide .cap2 .tt{font-family:'Archivo';font-weight:900;font-size:clamp(19px,5vw,28px);letter-spacing:-.5px;text-shadow:0 2px 10px rgba(0,0,0,.55);line-height:1.05}
  .hslide .cap2 .pp{font-family:'Archivo';font-weight:800;font-size:17px;margin-top:4px;display:flex;align-items:baseline;gap:8px}
  .hslide .cap2 .pp .an{font-size:13px;text-decoration:line-through;opacity:.7;font-weight:600}
  @media(min-width:720px){ .hslide{flex-basis:62%;max-width:62%;aspect-ratio:21/9} }
  /* carrusel de fotos en el producto (modal) */
  .gal{position:relative;border-radius:22px 22px 0 0;overflow:hidden;background:#eceef1}
  .gal .gtrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .gal .gtrack::-webkit-scrollbar{display:none}
  .gal .gslide{flex:0 0 100%;aspect-ratio:1/1;scroll-snap-align:center;background-position:center;background-size:cover;background-repeat:no-repeat;display:flex;align-items:center;justify-content:center;color:#c3c7cd;font-size:60px}
  .gal .gdots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:2}
  .gal .gdots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.6);box-shadow:0 1px 3px rgba(0,0,0,.5);transition:width .2s}
  .gal .gdots i.on{background:#fff;width:18px;border-radius:4px}
  .card .ph .count{position:absolute;bottom:8px;right:8px;background:rgba(14,16,19,.72);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:100px;z-index:2}

  /* ---------- catalog ---------- */
  .content{max-width:1040px;margin:0 auto;padding:22px 16px 40px}
  .sechead{text-align:center;margin:6px 0 20px}
  .eyebrow{font-family:'Archivo';font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:2.5px;color:#9a9ca3}
  .sechead h2{font-family:'Archivo';font-weight:900;font-size:23px;letter-spacing:-.5px;margin:4px 0 0}
  .search{max-width:360px;margin:14px auto 0}
  .search input{width:100%;padding:12px 16px;border:1px solid var(--bd);border-radius:100px;font-size:14px;background:#fff;font-family:'Inter';text-align:center}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05);display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
  .card:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(0,0,0,.12)}
  .card .ph{width:100%;aspect-ratio:1/1;background:#eceef1;display:flex;align-items:center;justify-content:center;color:#c3c7cd;font-size:34px;cursor:pointer;position:relative;overflow:hidden}
  .card .ph .im{position:absolute;inset:0;background-position:center;background-size:cover;transition:transform .45s ease}
  .card:hover .ph .im{transform:scale(1.06)}
  .tag{position:absolute;top:9px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:100px;color:#fff;font-family:'Inter';z-index:2}
  .tag.off{left:9px;background:#e11d48}
  .tag.dest{right:9px;background:rgba(14,16,19,.92);backdrop-filter:blur(4px)}
  .card .info{padding:12px 12px 13px;display:flex;flex-direction:column;flex:1}
  .card .t{font-size:14px;font-weight:600;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px;cursor:pointer;color:#1a1c20}
  .card .prow{margin-top:7px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .card .antes{font-size:12px;color:var(--gr);text-decoration:line-through}
  .card .p{font-family:'Archivo';font-size:18px;font-weight:800;color:var(--ac)}
  .card .talles{font-size:11px;color:var(--gr);margin-top:4px}
  .add{margin-top:11px;background:var(--ac);color:#fff;border:none;border-radius:11px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-family:'Inter';transition:filter .12s}
  .add:active{filter:brightness(1.15)}
  .qty{display:flex;align-items:center;justify-content:space-between;margin-top:11px;border:1.5px solid var(--ac);border-radius:11px;overflow:hidden}
  .qty button{background:var(--ac);color:#fff;border:none;width:38px;height:36px;font-size:18px;cursor:pointer;font-weight:700}
  .qty span{font-weight:800;color:var(--ac)}

  .empty{text-align:center;padding:56px 24px;color:var(--gr)}
  .empty .em{font-size:46px;margin-bottom:12px}
  .empty h2{font-family:'Archivo';font-size:19px;color:#1a1c20;margin:0 0 6px;font-weight:800}

  /* ---------- footer ---------- */
  .foot{max-width:1180px;margin:0 auto;padding:8px 16px 30px}
  .foot .cta{background:var(--ink);color:#fff;border-radius:22px;padding:26px 22px;text-align:center;position:relative;overflow:hidden}
  .foot .cta .glow{position:absolute;inset:0;background:radial-gradient(70% 120% at 50% 120%, color-mix(in srgb,var(--ac) 45%, transparent), transparent 60%)}
  .foot .cta > *{position:relative;z-index:2}
  .foot .cta h3{font-family:'Archivo';font-weight:800;font-size:21px;margin:0 0 4px}
  .foot .cta p{font-size:13.5px;color:rgba(255,255,255,.7);margin:0 0 16px}
  .foot .cta a{display:inline-flex;align-items:center;gap:8px;background:#25d366;color:#0a2e17;font-weight:800;text-decoration:none;padding:14px 24px;border-radius:100px;font-size:15px}
  .foot .mini{text-align:center;color:#a9abb2;font-size:11.5px;margin-top:16px}

  /* ---------- modales ---------- */
  .ov{position:fixed;inset:0;background:rgba(9,11,17,.74);display:none;align-items:center;justify-content:center;z-index:60}
  .ov.on{display:flex}
  .sheet{background:#fff;width:100%;max-width:500px;max-height:94vh;overflow-y:auto;border-radius:22px;animation:pop .2s ease}
  @keyframes pop{from{transform:scale(.96);opacity:.6}to{transform:scale(1);opacity:1}}
  .sheet .big{width:100%;aspect-ratio:1/1;background:#eceef1 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#c3c7cd;font-size:60px;border-radius:22px 22px 0 0}
  .sheet .body{padding:18px 20px 24px}
  .sheet .t{font-family:'Archivo';font-size:22px;font-weight:800;line-height:1.15}
  .sheet .p{font-family:'Archivo';font-size:26px;font-weight:800;color:var(--ac);margin:8px 0;display:flex;align-items:baseline;gap:10px}
  .sheet .antes{font-size:16px;color:var(--gr);text-decoration:line-through;font-weight:600;font-family:'Inter'}
  .sheet .off-pill{font-size:12px;background:#e11d48;color:#fff;padding:2px 8px;border-radius:100px;font-weight:800;font-family:'Inter'}
  .sheet .lbl{font-family:'Archivo';font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gr);font-weight:700;margin-top:14px}
  .sheet .dtxt{font-size:15px;color:#3f3f46;white-space:pre-wrap;line-height:1.5;margin-top:4px}
  .deliv-note{display:flex;align-items:center;gap:8px;margin-top:14px;background:#f2f7e8;border:1px solid #dcebc0;color:#3f5417;border-radius:12px;padding:10px 12px;font-size:12.5px;font-weight:600}
  .talles-w{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .talles-w span{border:1px solid var(--bd);border-radius:9px;padding:5px 12px;font-size:13px;font-weight:600;background:#fafafa}
  .close{position:sticky;top:0;display:flex;justify-content:flex-end;padding:8px;background:linear-gradient(#fff,rgba(255,255,255,0));z-index:2}
  .close button{background:rgba(0,0,0,.06);border:none;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
  .btn-main{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:18px;background:var(--ac);color:#fff;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;font-family:'Inter'}
  .btn-row{display:flex;gap:10px;margin-top:10px}
  .btn-ghost{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;background:#fff;color:var(--ac);border:1.5px solid var(--ac);border-radius:14px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;font-family:'Inter'}

  .citem{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #f1f1f3}
  .citem .cph{width:52px;height:52px;border-radius:10px;flex-shrink:0;background:#eceef1 center/cover no-repeat}
  .citem .cn{flex:1;min-width:0}
  .citem .cn .ct{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .citem .cn .cp{font-size:13px;color:var(--ac);font-weight:700}
  .miniqty{display:flex;align-items:center;gap:8px}
  .miniqty button{background:#f1f1f3;border:none;width:28px;height:28px;border-radius:8px;font-size:16px;cursor:pointer;font-weight:700;color:var(--ac)}
  .totrow{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-family:'Archivo';font-size:19px;font-weight:800}

  .wafab{position:fixed;right:16px;bottom:18px;z-index:58;width:58px;height:58px;border-radius:50%;background:#25d366;box-shadow:0 8px 22px rgba(37,211,102,.5);display:none;align-items:center;justify-content:center;text-decoration:none}
  .wafab svg{width:31px;height:31px;fill:#fff}
  .load{text-align:center;padding:80px 20px;color:var(--gr)}
  .spin{width:34px;height:34px;border:3px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 14px}
  @keyframes sp{to{transform:rotate(360deg)}}

  @media(min-width:720px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:20px}
    .content{padding:30px 20px 60px}
    .masthead .in{padding:48px 22px 50px}
  }
  @media(prefers-reduced-motion:reduce){
    .sheen,.dot{animation:none!important}
  }
</style>
</head>
<body>
<div class="app" id="app"><div class="load"><div class="spin"></div>Cargando...</div></div>

<a id="wafab" class="wafab" target="_blank" href="#"><svg viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163a11.867 11.867 0 01-1.587-5.945C.16 5.335 5.495 0 12.05 0a11.817 11.817 0 018.413 3.488 11.824 11.824 0 013.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 01-5.688-1.448L.057 24zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884a9.86 9.86 0 001.51 5.26l-.999 3.648 3.978-1.607zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.767.967-.94 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg></a>

<div class="ov" id="ov" onclick="if(event.target===this)cerrar()"><div class="sheet" id="sheet"></div></div>
<div class="ov" id="ovCart" onclick="if(event.target===this)closeCart()"><div class="sheet" id="sheetCart"></div></div>

<script>
const API='https://script.google.com/macros/s/AKfycbxc2TXvwKC60sBrIUXEdTMRMlCFC1syCQfyPMXr2esqG9XPvHFLX6UWu-HM17lKrOFM/exec';
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(n){n=Number(n)||0;return '$'+Math.round(n).toLocaleString('es-AR');}
function qs(k){return new URLSearchParams(location.search).get(k);}
function waNum(raw){let w=String(raw||'').replace(/[^\d]/g,'');if(!w)return '';if(w.indexOf('54')!==0)w='549'+w;return w;}
function lighten(hex,p){try{hex=hex.replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');let r=parseInt(hex.substr(0,2),16),g=parseInt(hex.substr(2,2),16),b=parseInt(hex.substr(4,2),16);r=Math.round(r*(1-p));g=Math.round(g*(1-p));b=Math.round(b*(1-p));return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');}catch(e){return '#'+hex;}}

// Config de entregas: días miércoles(3) a domingo(0), corte 17hs.
const ENTREGA={dias:[3,4,5,6,0], corte:17};
let DATA=null, CART={}, FILTRO='', FILTRO_CAT='', FILTRO_SUB='';
const LOCAL=qs('local');

async function cargar(){
  if(!LOCAL){ $('app').innerHTML=vacio('🔎','Falta el local','El link no tiene número de local.'); return; }
  try{
    const url=new URL(API); url.searchParams.set('accion','tienda_publica'); url.searchParams.set('local',LOCAL);
    const r=await fetch(url.toString()); const d=await r.json(); DATA=d;
    if(!d.ok || !d.autorizado){ $('app').innerHTML=vacio('🛍️','Tienda no disponible','Esta tienda no está activa por ahora.'); return; }
    aplicarTema(d.config||{});
    render(d);
    setupWa(d);
    tickEntrega(); setInterval(tickEntrega,30000);
    const pid=qs('prod'); if(pid){ const i=(d.productos||[]).findIndex(x=>x.id===pid); if(i>=0) setTimeout(()=>abrir(i),250); }
  }catch(e){ $('app').innerHTML=vacio('📡','Sin conexión','Probá de nuevo en un momento.'); }
}
function aplicarTema(cfg){
  const c=(cfg.color||'').trim();
  if(/^#?[0-9a-fA-F]{3,6}$/.test(c)){
    const hex=c[0]==='#'?c:('#'+c);
    document.documentElement.style.setProperty('--ac',hex);
    document.documentElement.style.setProperty('--ac-soft',lighten(hex,.2));
  }
}
function vacio(em,t,s){ return `<div class="masthead"><div class="glow"></div><div class="in"><div class="store">Tienda online</div></div></div><div class="empty"><div class="em">${em}</div><h2>${t}</h2><div>${s}</div></div>`; }

function delivEstado(){
  var cfg=(DATA&&DATA.config)||{};
  var dias=(cfg.entrega_dias&&cfg.entrega_dias.length)?cfg.entrega_dias:ENTREGA.dias;
  var corte=(typeof cfg.entrega_corte==='number')?cfg.entrega_corte:ENTREGA.corte;
  const now=new Date(); const day=now.getDay(); const h=now.getHours()+now.getMinutes()/60;
  const abierto = dias.indexOf(day)>=0 && h < corte;
  if(abierto){
    const mins=Math.round((corte-h)*60); const hh=Math.floor(mins/60); const mm=mins%60;
    const falta = hh>0 ? (hh+' h '+(mm>0?mm+' m':'')) : (mm+' m');
    return {abierto:true, texto:'Comprá en las próximas '+falta.trim()+' y lo recibís HOY'};
  }
  return {abierto:false, texto:'Comprá antes de las '+corte+' h y lo tenés hoy'};
}
function tickEntrega(){
  const box=$('delivLive'); if(!box) return;
  const e=delivEstado();
  box.innerHTML = `<span class="live ${e.abierto?'':'off'}"><span class="dot"></span>🛵 ${esc(e.texto)}</span>`;
}

function render(d){
  const cfg=d.config||{}; const prods=d.productos||[];
  const titulo=(cfg.titulo||d.nombre||('Local '+d.local));
  const cover=cfg.portada_url;
  const conBuscador = prods.length>=6;
  let html=`
    <div class="topbar"><div class="in">
      <div class="brand">${esc(titulo)}</div>
      <button class="cartbtn" onclick="openCart()">🛒 Pedido <span class="n" id="cbN">0</span></button>
    </div></div>
    <section class="masthead">
      ${cover?`<div class="cover-bg" style="background-image:url('${esc(cover)}')"></div><div class="veil"></div>`:`<div class="glow"></div>`}
      <div class="sheen"></div>
      <div class="in">
        ${cfg.logo_url?`<img class="logo-img" src="${esc(cfg.logo_url)}" alt="${esc(titulo)}">`:''}
        ${cfg.mostrar_nombre!==false?`<div class="store">${esc(titulo)}</div>`:''}
        ${cfg.descripcion?`<div class="storedesc">${esc(cfg.descripcion)}</div>`:''}
        <div class="rule"></div>
      </div>
    </section>
    ${cfg.entrega_on!==false ? `
    <section class="delivband"><div class="in">
      <div class="hook"><span class="moto">🛵</span><span class="big">${esc(cfg.entrega_tit||'ENTREGAS EN EL DÍA')}</span></div>
      ${cfg.entrega_sub?`<div class="subhook">${esc(cfg.entrega_sub)}</div>`:''}
      <div id="delivLive"></div>
    </div></section>` : ''}
    <div class="trust">
      ${(cfg.chips||['🛵 Envío en el día','💬 Te atendemos al toque','📍 Retiro en el local','🔒 Comprá con confianza']).filter(function(c){return c && String(c).trim();}).map(function(c){return '<div class="chip">'+esc(c)+'</div>';}).join('')}
    </div>
    ${heroSliderHTML(prods)}
    <div class="content">`;
  if(!prods.length){
    html+=`<div class="empty"><div class="em">📦</div><h2>Se vienen novedades</h2><div>Esta tienda está cargando sus productos. Volvé pronto y guardá el link.</div></div>`;
  } else {
    html+=`<div class="sechead">
      <div class="eyebrow">La tienda</div>
      <h2>Nuestros productos</h2>
      ${conBuscador?`<div class="search"><input type="text" placeholder="Buscar..." oninput="filtrar(this.value)"></div>`:''}
    </div><div id="filtros"></div><div class="grid" id="grid"></div>`;
  }
  const wa=waNum(d.whatsapp);
  html+=`</div>
    <div class="foot">
      <div class="cta">
        <div class="glow"></div>
        <h3>${esc(cfg.cierre_tit||'¿Alguna duda? 👋')}</h3>
        <p>${esc(cfg.cierre_sub||'Escribinos y te ayudamos a elegir. Coordinás el envío o el retiro en el momento.')}</p>
        ${wa?`<a href="https://wa.me/${wa}?text=${encodeURIComponent('¡Hola! Vengo de tu tienda online 👋')}" target="_blank">💬 Escribinos por WhatsApp</a>`:''}
      </div>
      ${cfg.formas_pago?`<div class="mini" style="color:#c7cad1;margin-top:14px">💳 Formas de pago: ${esc(cfg.formas_pago)}</div>`:''}
      ${cfg.entrega_on!==false?`<div class="mini">🛵 ${esc(cfg.entrega_tit||'Entregas en el día')} · comprá antes de las ${cfg.entrega_corte||17} h</div>`:''}
    </div>`;
  $('app').innerHTML=html;
  if(prods.length){ pintarFiltros(); pintarGrid(); }
  tickEntrega();
  heroAuto();
}
function visibles(){ const f=FILTRO.toLowerCase().trim(); return (DATA.productos||[]).map((p,i)=>({p,i})).filter(o=> (!f || (o.p.titulo||'').toLowerCase().indexOf(f)>=0 || (o.p.descripcion||'').toLowerCase().indexOf(f)>=0) && (!FILTRO_CAT || o.p.cat===FILTRO_CAT) && (!FILTRO_SUB || o.p.subcat===FILTRO_SUB) ); }
function pintarFiltros(){
  const cont=$('filtros'); if(!cont) return;
  const cats=(DATA&&DATA.categorias)||[];
  if(!cats.length){ cont.innerHTML=''; return; }
  let html='<div class="filtros"><div class="fchip '+(FILTRO_CAT?'':'on')+'" onclick="filtrarCat(\'\')">Todos</div>'+
    cats.map(function(c){return '<div class="fchip '+(FILTRO_CAT===c.id?'on':'')+'" onclick="filtrarCat(\''+c.id+'\')">'+esc(c.nombre)+'</div>';}).join('')+'</div>';
  const sel=cats.filter(function(c){return c.id===FILTRO_CAT;})[0];
  if(sel && sel.subs && sel.subs.length){
    html+='<div class="fsubs"><div class="fsub '+(FILTRO_SUB?'':'on')+'" onclick="filtrarSub(\'\')">Todo '+esc(sel.nombre)+'</div>'+
      sel.subs.map(function(s){return '<div class="fsub '+(FILTRO_SUB===s.id?'on':'')+'" onclick="filtrarSub(\''+s.id+'\')">'+esc(s.nombre)+'</div>';}).join('')+'</div>';
  }
  cont.innerHTML=html;
}
function filtrarCat(id){ FILTRO_CAT=id; FILTRO_SUB=''; pintarFiltros(); pintarGrid(); }
function filtrarSub(id){ FILTRO_SUB=id; pintarFiltros(); pintarGrid(); }
function heroSliderHTML(prods){
  var feat=(prods||[]).filter(function(p){return p.foto_url;});
  var dest=feat.filter(function(p){return p.destacado;});
  var list=(dest.length?dest:feat).slice(0,6);
  if(list.length<2) return '';
  return '<div class="hslider"><div class="hlabel">'+(dest.length?'Destacados':'Lo nuevo')+'</div><div class="htrack" id="htrack">'+
    list.map(function(p){var i=(DATA.productos||[]).indexOf(p);return '<div class="hslide" style="background-image:url(\''+esc(p.foto_url)+'\')" onclick="abrir('+i+')"><div class="ov2"></div><div class="cap2">'+(p.destacado?'<span class="badge">★ Destacado</span>':(p.descuento>0?'<span class="badge">-'+p.descuento+'% OFF</span>':''))+'<div class="tt">'+esc(p.titulo)+'</div><div class="pp">'+(p.precio_antes>p.precio?'<span class="an">'+money(p.precio_antes)+'</span>':'')+(p.precio>0?money(p.precio):'')+'</div></div></div>';}).join('')+
    '</div></div>';
}
var _heroTimer=null;
function heroAuto(){
  var t=$('htrack'); if(!t) return;
  if(_heroTimer) clearInterval(_heroTimer);
  var seg=(DATA&&DATA.config&&typeof DATA.config.carrusel_seg==='number')?DATA.config.carrusel_seg:3.8;
  if(!seg || seg<=0) return; // 0 = no pasa solo
  _heroTimer=setInterval(function(){
    if(!document.body.contains(t)){clearInterval(_heroTimer);return;}
    var w=t.querySelector('.hslide'); if(!w) return; var step=w.offsetWidth+12;
    var next=t.scrollLeft+step;
    if(next > t.scrollWidth - t.clientWidth - 10) next=0;
    t.scrollTo({left:next, behavior:'smooth'});
  }, Math.round(seg*1000));
}
function cardHTML(p,i){
  const bg=p.foto_url?`style="background-image:url('${esc(p.foto_url)}')"`:'';
  const nFotos=(p.fotos_urls&&p.fotos_urls.length)||0;
  const q=CART[p.id]?CART[p.id].qty:0;
  const ctrl = q>0
    ? `<div class="qty"><button onclick="dec('${p.id}',event)">−</button><span>${q}</span><button onclick="inc('${p.id}',event)">+</button></div>`
    : `<button class="add" onclick="add('${p.id}',event)">＋ Agregar</button>`;
  return `<div class="card">
    <div class="ph" onclick="abrir(${i})">${p.foto_url?`<div class="im" ${bg}></div>`:'🖼️'}${p.descuento>0?`<span class="tag off">-${p.descuento}%</span>`:''}${p.destacado?`<span class="tag dest">★ Destacado</span>`:''}${nFotos>1?`<span class="count">📷 ${nFotos}</span>`:''}</div>
    <div class="info">
      <div class="t" onclick="abrir(${i})">${esc(p.titulo)}</div>
      <div class="prow">${p.precio_antes>p.precio?`<span class="antes">${money(p.precio_antes)}</span>`:''}${p.precio>0?`<span class="p">${money(p.precio)}</span>`:''}</div>
      ${p.talles?`<div class="talles">Talles: ${esc(p.talles)}</div>`:''}
      ${p.precio>0?ctrl:''}
    </div>
  </div>`;
}
function pintarGrid(){ const g=$('grid'); if(!g)return; const vis=visibles(); g.innerHTML=vis.length?vis.map(o=>cardHTML(o.p,o.i)).join(''):`<div class="empty" style="grid-column:1/-1"><div class="em">🔍</div><h2>Sin resultados</h2></div>`; actualizarCarrito(); }
function filtrar(q){ FILTRO=q||''; pintarGrid(); }

function abrir(i){
  const p=(DATA.productos||[])[i]; if(!p) return;
  const wa=waNum(DATA.whatsapp);
  const msg=encodeURIComponent(`¡Hola! Me interesa: ${p.titulo}`);
  const q=CART[p.id]?CART[p.id].qty:0;
  const bg=p.foto_url?`style="background-image:url('${esc(p.foto_url)}')"`:'';
  const ctrl = q>0
    ? `<div class="qty" style="margin-top:18px"><button onclick="dec('${p.id}',event);syncSheetQty('${p.id}')">−</button><span>${q}</span><button onclick="inc('${p.id}',event);syncSheetQty('${p.id}')">+</button></div>`
    : `<button class="btn-main" onclick="add('${p.id}',event);syncSheetQty('${p.id}')">＋ Agregar al pedido</button>`;
  $('sheet').innerHTML=`
    <div class="close"><button onclick="cerrar()">✕</button></div>
    ${galeriaHTML(p)}
    <div class="body">
      <div class="t">${esc(p.titulo)}</div>
      <div class="p">${p.precio_antes>p.precio?`<span class="antes">${money(p.precio_antes)}</span>`:''}${p.precio>0?money(p.precio):''}${p.descuento>0?`<span class="off-pill">-${p.descuento}%</span>`:''}</div>
      ${p.talles?`<div class="lbl">Talles disponibles</div><div class="talles-w">${p.talles.split(/[,\/]/).map(t=>t.trim()).filter(Boolean).map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}
      ${p.descripcion?`<div class="lbl">Descripción</div><div class="dtxt">${esc(p.descripcion)}</div>`:''}
      <div class="deliv-note">🛵 Comprá antes de las 17 h (miércoles a domingo) y lo recibís hoy.</div>
      <div id="sheetCtrl_${p.id}">${p.precio>0?ctrl:''}</div>
      <div class="btn-row">
        ${wa?`<a class="btn-ghost" href="https://wa.me/${wa}?text=${msg}" target="_blank">💬 Consultar</a>`:''}
        <button class="btn-ghost" onclick="compartirProd('${p.id}')">🔗 Compartir</button>
      </div>
    </div>`;
  $('ov').classList.add('on'); document.body.style.overflow='hidden';
}
function syncSheetQty(id){
  const q=CART[id]?CART[id].qty:0; const cont=$('sheetCtrl_'+id); if(!cont) return;
  cont.innerHTML = q>0
    ? `<div class="qty" style="margin-top:18px"><button onclick="dec('${id}',event);syncSheetQty('${id}')">−</button><span>${q}</span><button onclick="inc('${id}',event);syncSheetQty('${id}')">+</button></div>`
    : `<button class="btn-main" onclick="add('${id}',event);syncSheetQty('${id}')">＋ Agregar al pedido</button>`;
}
function cerrar(){ $('ov').classList.remove('on'); document.body.style.overflow=''; }
function compartirProd(id){
  const p=(DATA.productos||[]).find(x=>x.id===id); if(!p)return;
  const url=location.origin+location.pathname+'?local='+encodeURIComponent(LOCAL)+'&prod='+encodeURIComponent(id);
  const txt=`${p.titulo} — ${money(p.precio)}`;
  if(navigator.share){ navigator.share({title:p.titulo,text:txt,url:url}).catch(()=>{}); }
  else if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(()=>alert('Link copiado:\n'+url)).catch(()=>prompt('Copiá el link:',url)); }
  else prompt('Copiá el link:',url);
}
function galeriaHTML(p){
  var urls=(p.fotos_urls&&p.fotos_urls.length)?p.fotos_urls:(p.foto_url?[p.foto_url]:[]);
  if(!urls.length) return '<div class="big">🖼️</div>';
  if(urls.length===1) return '<div class="big" style="background-image:url(\''+esc(urls[0])+'\')"></div>';
  return '<div class="gal"><div class="gtrack" id="gtrack" onscroll="galDots()">'+
    urls.map(function(u){return '<div class="gslide" style="background-image:url(\''+esc(u)+'\')"></div>';}).join('')+
    '</div><div class="gdots" id="gdots">'+urls.map(function(u,k){return '<i class="'+(k===0?'on':'')+'"></i>';}).join('')+'</div></div>';
}
function galDots(){
  var t=$('gtrack'), d=$('gdots'); if(!t||!d) return;
  var idx=Math.round(t.scrollLeft/Math.max(1,t.clientWidth));
  Array.prototype.forEach.call(d.children,function(el,k){ el.className = k===idx?'on':''; });
}

function add(id,e){ if(e)e.stopPropagation(); const p=(DATA.productos||[]).find(x=>x.id===id); if(!p)return; CART[id]={producto:p,qty:(CART[id]?CART[id].qty:0)+1}; pintarGrid(); }
function inc(id,e){ if(e)e.stopPropagation(); if(CART[id])CART[id].qty++; pintarGrid(); if($('ovCart').classList.contains('on'))openCart(); }
function dec(id,e){ if(e)e.stopPropagation(); if(CART[id]){ CART[id].qty--; if(CART[id].qty<=0) delete CART[id]; } pintarGrid(); if($('ovCart').classList.contains('on'))openCart(); }

function totalCart(){ let n=0,t=0; Object.values(CART).forEach(it=>{n+=it.qty; t+=it.qty*(Number(it.producto.precio)||0);}); return {n,t}; }
function actualizarCarrito(){ const {n}=totalCart(); const el=$('cbN'); if(el)el.textContent=n; }
function openCart(){
  const items=Object.values(CART); const {t}=totalCart(); const wa=waNum(DATA.whatsapp);
  if(!items.length){ $('sheetCart').innerHTML=`<div class="close"><button onclick="closeCart()">✕</button></div><div class="body" style="padding-top:0"><div class="empty"><div class="em">🛒</div><h2>Tu pedido está vacío</h2><div>Agregá productos y armá tu pedido.</div></div></div>`; $('ovCart').classList.add('on'); document.body.style.overflow='hidden'; return; }
  $('sheetCart').innerHTML=`
    <div class="close"><button onclick="closeCart()">✕</button></div>
    <div class="body" style="padding-top:0">
      <div class="t" style="margin-bottom:6px">Mi pedido</div>
      ${items.map(it=>{const p=it.producto;const bg=p.foto_url?`style="background-image:url('${esc(p.foto_url)}')"`:'';return `
        <div class="citem">
          <div class="cph" ${bg}></div>
          <div class="cn"><div class="ct">${esc(p.titulo)}</div><div class="cp">${money(p.precio)} c/u</div></div>
          <div class="miniqty"><button onclick="dec('${p.id}')">−</button><b>${it.qty}</b><button onclick="inc('${p.id}')">+</button></div>
        </div>`;}).join('')}
      <div class="totrow"><span>Total</span><span>${money(t)}</span></div>
      <div class="deliv-note">🛵 Comprando antes de las 17 h (mié a dom) lo recibís hoy en tu casa.</div>
      ${wa?`<button class="btn-main" onclick="pedidoWhatsApp()">💬 Hacer el pedido por WhatsApp</button>`:`<div style="text-align:center;color:var(--gr);margin-top:16px">La tienda aún no cargó su WhatsApp.</div>`}
    </div>`;
  $('ovCart').classList.add('on'); document.body.style.overflow='hidden';
}
function closeCart(){ $('ovCart').classList.remove('on'); document.body.style.overflow=''; }
function pedidoWhatsApp(){
  const wa=waNum(DATA.whatsapp); if(!wa) return;
  const items=Object.values(CART); const {t}=totalCart();
  let msg='¡Hola! Quiero hacer este pedido:\n';
  items.forEach(it=>{ msg+=`• ${it.qty}x ${it.producto.titulo} — ${money(it.qty*(Number(it.producto.precio)||0))}\n`; });
  msg+=`Total: ${money(t)}\n¿Coordinamos envío en el día?`;
  try{ fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({accion:'tienda_pedido',local:LOCAL,total:t,items:items.map(it=>({qty:it.qty,titulo:it.producto.titulo}))})}).catch(()=>{}); }catch(e){}
  window.open(`https://wa.me/${wa}?text=${encodeURIComponent(msg)}`,'_blank');
}
function setupWa(d){ const wa=waNum(d.whatsapp); const fab=$('wafab'); if(wa){ fab.href=`https://wa.me/${wa}?text=${encodeURIComponent('¡Hola! Vengo de tu tienda online 👋')}`; fab.style.display='flex'; } }

cargar();
</script>
</body>
</html>
